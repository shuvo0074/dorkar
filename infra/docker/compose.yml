    command: ['sh', '-c', 'node dist/migrate.js up && exec node --enable-source-maps dist/main.js']
    environment:
      <<: *env
      SERVICE_NAME: identity-service
      PORT: '4001'
      DATABASE_URL: postgres://svc_identity:dev_identity_pw@postgres:5432/dorkar
      DATABASE_SCHEMA: identity
      CORS_ORIGINS: http://localhost:5173
