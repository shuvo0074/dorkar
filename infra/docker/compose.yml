    redis: { condition: service_healthy }

x-env: &env
  NODE_ENV: development
  HOST: 0.0.0.0
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379/0
  DATABASE_SSL: disable
  TRUST_PROXY: '1'
  JWKS_URL: http://identity:4001/.well-known/jwks.json
  VERIFICATION_URL: http://verification:4003
  PROFILE_URL: http://profile:4002
  IDENTITY_URL: http://identity:4001

services:
  postgres:
