appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil: { visible: { id: "tab-post" }, timeout: 60000 }
- tapOn: { id: "tab-Home" }
- tapOn: { id: "tab-post" }
- inputText: "Used bicycle for my son"
- tapOn: { point: "50%,18%" }
- tapOn: { id: "post" }
- extendedWaitUntil: { visible: "Category.*", timeout: 15000 }
- takeScreenshot: ${OUT}/need-form
