    <!--
      THESIS: The marketplace as a need catalog. Every Need is a numbered square in a printed
      catalog, coded by mode, and you circle what matters in ballpoint. Refuses the category's
      listing grid with a search bar and promo carousel.
      OWN-WORLD: Newsprint ground (#E6E2D8) with paper-fibre grain, ink black (#111), one hall red
      (#C8322D) for codes, keys and rules, ballpoint blue (#24398F) only for hand-drawn circles and
      marks. Courier Prime for codes and catalog text,
      Noto Sans Bengali (condensed for display). Ruled boxes, stamp-size line drawings, thick ink
      buttons with printed-ink wear, outlined secondaries; Anton heavy condensed caps for display;
      4px corners on controls and boxes, square stamp plates; no shadows, no gradients.
      STORY: A visitor understands they post what they need and the market answers; believes it
      because the catalog shows what needs look like; signs in with a phone number and posts.
      FIRST VIEWPORT: Masthead with DORKAR | দরকার and a red rule. "WHAT DO YOU NEED?" at display
      scale, the mode key (B Buy, R Rent, L Borrow, H Hire, S Source) as red key tiles with the
      chosen one circled in biro, the need field and an ink "POST NEED" button above the fold;
      on desktop the example catalog grid fills the right column.
      FORM: Circle Catalog (user-chosen challenger, round 2; round-1 seed key 2be4c7bb).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
